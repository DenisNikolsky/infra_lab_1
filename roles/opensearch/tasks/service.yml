---
- name: Create OpenSearch systemd unit
  ansible.builtin.template:
    src: opensearch.service.j2
    dest: /etc/systemd/system/opensearch.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart opensearch

- name: Create OpenSearch Dashboards systemd unit
  ansible.builtin.template:
    src: opensearch-dashboards.service.j2
    dest: /etc/systemd/system/opensearch-dashboards.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart opensearch-dashboards

- name: Enable and start OpenSearch
  ansible.builtin.systemd:
    name: opensearch
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start OpenSearch Dashboards
  ansible.builtin.systemd:
    name: opensearch-dashboards
    enabled: true
    state: started
    daemon_reload: true