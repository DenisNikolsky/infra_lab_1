---
- name: Create opensearch group
  ansible.builtin.group:
    name: opensearch
    system: true
    state: present

- name: Create opensearch user
  ansible.builtin.user:
    name: opensearch
    group: opensearch
    system: true
    shell: /sbin/nologin
    home: /opt/opensearch
    create_home: false
    state: present

- name: Create base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0755"
  loop:
    - /opt
    - /etc/opensearch
    - /etc/opensearch-dashboards
    - /var/lib/opensearch
    - /var/log/opensearch
    - /var/lib/opensearch-dashboards
    - /var/log/opensearch-dashboards

- name: Download OpenSearch tarball
  ansible.builtin.get_url:
    url: "{{ opensearch_download_url }}"
    dest: "/tmp/opensearch-{{ opensearch_version }}.tar.gz"
    mode: "0644"

- name: Extract OpenSearch
  ansible.builtin.unarchive:
    src: "/tmp/opensearch-{{ opensearch_version }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/opensearch-{{ opensearch_version }}"

- name: Create OpenSearch symlink
  ansible.builtin.file:
    src: "/opt/opensearch-{{ opensearch_version }}"
    dest: /opt/opensearch
    state: link
    force: true

- name: Download OpenSearch Dashboards tarball
  ansible.builtin.get_url:
    url: "{{ opensearch_dashboards_download_url }}"
    dest: "/tmp/opensearch-dashboards-{{ opensearch_dashboards_version }}.tar.gz"
    mode: "0644"

- name: Extract OpenSearch Dashboards
  ansible.builtin.unarchive:
    src: "/tmp/opensearch-dashboards-{{ opensearch_dashboards_version }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/opensearch-dashboards-{{ opensearch_dashboards_version }}"

- name: Create OpenSearch Dashboards symlink
  ansible.builtin.file:
    src: "/opt/opensearch-dashboards-{{ opensearch_dashboards_version }}"
    dest: /opt/opensearch-dashboards
    state: link
    force: true

- name: Copy default OpenSearch config
  ansible.builtin.copy:
    src: /opt/opensearch/config/
    dest: /etc/opensearch/
    remote_src: true
    owner: opensearch
    group: opensearch
    mode: preserve
  notify: restart opensearch

- name: Copy default Dashboards config
  ansible.builtin.copy:
    src: /opt/opensearch-dashboards/config/
    dest: /etc/opensearch-dashboards/
    remote_src: true
    owner: opensearch
    group: opensearch
    mode: preserve
  notify: restart opensearch-dashboards