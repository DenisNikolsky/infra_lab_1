---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart opensearch
  ansible.builtin.systemd:
    name: opensearch
    state: restarted
    daemon_reload: true

- name: restart opensearch-dashboards
  ansible.builtin.systemd:
    name: opensearch-dashboards
    state: restarted
    daemon_reload: true